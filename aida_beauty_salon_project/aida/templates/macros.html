{% macro stars(n) %}<span class="stars" role="img" aria-label="{{ t('reviews.stars', n=n) }}">{% for i in range(1, 6) %}<span class="{{ 'on' if i <= n else 'off' }}">★</span>{% endfor %}</span>{% endmacro %}

{% macro quote(r) %}
<figure class="quote">
  {{ stars(r.rating) }}
  <blockquote>{{ r.body }}</blockquote>
  <figcaption>{{ r.name }}<span class="muted">, {{ r.created_at[:10] | ldate }}</span></figcaption>
</figure>
{% endmacro %}

{% macro service_row(s) %}
<article class="service-row">
  <div class="service-main">
    <h3>{{ L(s, 'name') }}</h3>
    <p class="muted">{{ L(s, 'desc') }}</p>
  </div>
  <div class="service-side">
    <span class="price">{{ price_label(s.price, s.price_from) }}</span>
    <span class="dur">{{ s.duration }} {{ t('minutes') }}</span>
    <a class="btn small ghost" href="{{ url_for('booking', service=s.id) }}">{{ t('cta.book_this') }}</a>
  </div>
</article>
{% endmacro %}
